name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version:
          [
            "1.21.x",
            "1.27.x",
          ]
    name: Go ${{ matrix.go-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...